title: NOUS | National Orthodox United Schools
description: Advancing Orthodox Christian Education — networking, resources, and support for Orthodox schools, co-ops, and homeschool families.
url: "https://orthodoxschool.org"
baseurl: ""
markdown: kramdown
highlighter: rouge
permalink: /blog/:title/

contact_email: dionysiusbuhler@gmail.com

exclude:
  - README.md
  - "assets/FUTURE config yaml.md"
  - "assets/# FUTURE  CNAME"

# SEO / social (jekyll-seo-tag + jekyll-sitemap are both supported by GitHub Pages)
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
lang: en_US
tagline: Advancing Orthodox Christian Education
logo: /assets/icon-512.png
defaults:
  - scope:
      path: ""
    values:
      image: /assets/og-image.jpg
  - scope:
      path: "assets"
    values:
      sitemap: false

# Cookieless analytics (GoatCounter)
goatcounter: orthodoxschool
